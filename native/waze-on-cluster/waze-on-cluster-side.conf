# waze-on-cluster as a side camera view: the camera unit's video (the stream Drive Recorder and the parking cameras
# use) in the cluster's map area while an app turns its cluster on through this copy's control socket
# ({"cmd":"cluster","on":"1"}), for example while a turn signal shows one side camera (the camera unit asked for view 3,
# left, or 4, right, as the app's own camera claim). Only the keys that differ from waze-on-cluster.conf's built-in
# defaults; no features, no CarPlay.
features_file = /var/opt/waze-on-cluster/side.features.conf
socket_path = /dev/shm/waze-on-cluster-side/ctl.sock
socket_group = tm_oap_app
log_file = /var/opt/waze-on-cluster/log/waze-on-cluster-side.log
fifo_path = /run/waze-on-cluster-side/cam.h264
udp_port = 20558
avb_stream = media_transport.avb_streaming.1
# the map area below the cluster's model badge (its top 36 rows)
tex_size = 1088x408
src_crop =
map_rect = 0,36,1088,408
tex_level_bits = 1
hide_bmw_guidance = 0
state_file = /var/opt/waze-on-cluster/state/side.state.conf
map_state_file = /var/opt/waze-on-cluster/state/side.map.state.conf
cluster = 0
hud = 0
alt_screen_port = 0
stall_ms = 1000
idle_ms = 2000
blank_ms = 1000
freeze_ms = 0
dirty_threshold = 4
dirty_settle_ms = 500
